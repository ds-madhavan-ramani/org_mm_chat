name: app_environment
channels:
  - snowflake
dependencies:
  # Inert on this account: warehouse runtime defaults to Streamlit 1.22.0
  # regardless of what's pinned here (confirmed not overridable even after
  # a redeploy) — this project now runs on container runtime instead (see
  # pyproject.toml), which does respect its manifest's version pin. Kept
  # in sync with pyproject.toml/requirements.txt (1.50.0) purely so all
  # three manifests state the same target version, in case warehouse
  # runtime is ever revisited.
  - streamlit=1.50.0
  - requests
  - pandas